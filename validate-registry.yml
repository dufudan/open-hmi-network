name: Validate HMI Network Registry

on:
  pull_request:
    paths:
      - 'data/registry/**/*.json'
      - 'scripts/validate_registry.py'
  push:
    branches: [ main ]
    paths:
      - 'data/registry/**/*.json'
      - 'scripts/validate_registry.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/validate_registry.py
