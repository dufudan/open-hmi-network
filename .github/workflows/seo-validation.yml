name: Validate crawl foundations
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python scripts/render_discovery.py --check
      - run: python scripts/test_publication.py
      - run: node scripts/test_canonical_navigation.cjs
      - run: python scripts/validate_seo.py
